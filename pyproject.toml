[project]
name = "webscreencap"
version = "0.1.0"
description = "Captures screenshots and HTML of web pages asynchronously."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.143.0",
    "json5>=0.17.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.32",
    "flower>=2.2.0",
]
