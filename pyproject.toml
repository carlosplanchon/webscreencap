[project]
name = "webscreencap"
version = "0.1.0"
description = "Captures screenshots and HTML of web pages asynchronously."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.4",
    "redis>=8.1.0",
    "taskiq>=0.13.0,<0.14",
    "taskiq-redis>=1.2.4,<2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.32",
]
