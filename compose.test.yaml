# Test stack for tests/run.sh
name: webscreencap-tests

x-env: &env
  API_KEY: test-key
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL_S3: http://10.250.251.10:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  BUCKET_NAME: webscreencap-tests

x-worker-build: &worker-build
  context: .
  dockerfile: Dockerfile_CELERY_WORKER

services:
  redis:
    image: redis:7.4.11-alpine

  s3:
    image: motoserver/moto:5.2.3
    networks:
      default:
        ipv4_address: 10.250.251.10

  s3-bucket:
    image: python:3.13.16-slim-bookworm
    command:
      - python
      - -c
      - |
        import time, urllib.error, urllib.request
        for _ in range(60):
            try:
                urllib.request.urlopen(urllib.request.Request("http://10.250.251.10:5000/webscreencap-tests", method="PUT"))
                break
            except urllib.error.HTTPError as error:
                if error.code == 409:  # already there
                    break
                raise
            except OSError:
                time.sleep(1)
        else:
            raise SystemExit("moto didn't come up")
    depends_on: [s3]

  api:
    build:
      context: .
      dockerfile: Dockerfile_MAIN_API
    environment: *env
    depends_on: [redis]

  worker:
    build: *worker-build
    environment: *env
    init: true
    security_opt: ["seccomp=seccomp_profile.json"]
    networks: [default, public]
    depends_on:
      redis:
        condition: service_started
      s3-bucket:
        condition: service_completed_successfully

  site:
    image: python:3.13.16-slim-bookworm
    command: ["python", "-I", "/fixtures/site.py", "public"]
    volumes:
      - ./tests/fixtures:/fixtures:ro
    networks: [public]

  internal:
    image: python:3.13.16-slim-bookworm
    command: ["python", "-I", "/fixtures/site.py", "internal"]
    volumes:
      - ./tests/fixtures:/fixtures:ro

  tests:
    build: *worker-build
    environment:
      <<: *env
      API_URL: http://api:31337/webscreencap/api
      SITE_URL: http://site:8080
      SITE_CONTROL_URL: http://site:8081
      INTERNAL_URL: http://internal:8080
      INTERNAL_CONTROL_URL: http://internal:8081
    volumes:
      - ./tests:/app/tests:ro
    init: true
    security_opt: ["seccomp=seccomp_profile.json"]
    networks: [default, public]
    working_dir: /app/tests
    command: ["python", "-m", "unittest", "discover", "-v"]
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
      site:
        condition: service_started
      internal:
        condition: service_started
      s3-bucket:
        condition: service_completed_successfully

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.251.0/24
  # Outside the private ranges, so the egress proxy treats it as public
  public:
    ipam:
      config:
        - subnet: 11.250.0.0/24
