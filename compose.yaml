# Local stack, with Redis and moto instead of Tigris
name: webscreencap

x-env: &env
  API_KEY: local-dev-key
  REDIS_URL: redis://redis:6379/0
  AWS_REGION: us-east-1
  # An IP, so the S3 SDK doesn't put the bucket in the host name
  AWS_ENDPOINT_URL_S3: http://10.250.250.10:5000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  BUCKET_NAME: webscreencap

services:
  redis:
    image: redis:7.4.11-alpine
    # The API and the worker connect to it as soon as they start
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 30

  s3:
    image: motoserver/moto:5.2.4
    networks:
      default:
        ipv4_address: 10.250.250.10

  # Creates the bucket once moto is up
  s3-bucket:
    image: python:3.15.1-slim-bookworm
    command:
      - python
      - -c
      - |
        import time, urllib.error, urllib.request
        for _ in range(60):
            try:
                urllib.request.urlopen(urllib.request.Request("http://10.250.250.10:5000/webscreencap", method="PUT"))
                break
            except urllib.error.HTTPError as error:
                if error.code == 409:  # already there
                    break
                raise
            except OSError:
                time.sleep(1)
        else:
            raise SystemExit("moto didn't come up")
    depends_on: [s3]

  api:
    build:
      context: .
      dockerfile: Dockerfile_MAIN_API
    environment: *env
    ports:
      - "127.0.0.1:31337:31337"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile_WORKER
    environment: *env
    # Reaps Chromium's leftover processes, like Fly's init
    init: true
    # Lets Chromium create the user namespaces of its sandbox
    security_opt: ["seccomp=seccomp_profile.json"]
    # Longer than a capture can take, so stopping the worker doesn't cut one short
    stop_grace_period: 200s
    depends_on:
      redis:
        condition: service_healthy
      s3-bucket:
        condition: service_completed_successfully

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.250.0/24
